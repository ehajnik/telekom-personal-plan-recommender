name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,ml]"

      - name: Generate synthetic data and train ML profiles
        run: |
          python scripts/generate_synthetic_data.py --subscribers 300 --seed 42
          python scripts/subscriber_profiling.py \
            --input data/raw/private_mobile_usage_300_subscribers_12_months.csv \
            --min-silhouette 0.5

      - name: Unit tests
        env:
          OLLAMA_ENABLED: "false"
          PROFILER_MODE: "rules"
        run: python -m unittest discover -s tests -v

      - name: Sanity check
        env:
          OLLAMA_ENABLED: "false"
          PROFILER_MODE: "rules"
        run: python scripts/sanity_check.py

      - name: Ruff
        run: ruff check telekom_profiler tests scripts

      - name: Mypy
        run: mypy telekom_profiler
