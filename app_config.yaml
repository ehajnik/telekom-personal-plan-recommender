model:
  n_profiles: 5
  profile_labels:
    - Light / occasional user
    - Streaming & data-heavy
    - Voice-centric
    - Roaming / travel-heavy
    - Broad usage profile
  profile_emoji:
    Light / occasional user: "🌱"
    Streaming & data-heavy: "📺"
    Voice-centric: "📞"
    Roaming / travel-heavy: "✈️"
    Broad usage profile: "📶"
  # Clustering space: log1p of the four usage levels that the UI sliders and upstream
  # billing feeds provide directly. Features that would have to be imputed at inference
  # time (session size, active days, plan tier, countries) are deliberately excluded —
  # they made slider-entered customers land in the wrong segment (see docs/development.md §4.2).
  cluster_features:
    - log_data_gb
    - log_voice_min
    - log_sms_count
    - log_roaming_days
  # Canonical anchors per label in human units (12-month subscriber means). Training maps
  # them into the clustering space and solves label↔cluster matching (Hungarian algorithm).
  # They also feed the profile reference table. Source: per-archetype means of the committed
  # synthetic panel (seed 42, 1000 subscribers) — regenerate with
  #   python scripts/evaluate_model.py --print-anchors
  fixed_centroids:
    Light / occasional user:
      data_gb_mean: 3.56
      voice_min_mean: 78.70
      sms_count_mean: 17.55
      roaming_days_mean: 0.54
      countries_visited_mean: 0.39
      active_days_mean: 14.13
      plan_tier_mean: 1.49
    Streaming & data-heavy:
      data_gb_mean: 108.32
      voice_min_mean: 285.75
      sms_count_mean: 30.35
      roaming_days_mean: 2.33
      countries_visited_mean: 1.10
      active_days_mean: 27.85
      plan_tier_mean: 4.53
    Voice-centric:
      data_gb_mean: 6.86
      voice_min_mean: 1522.72
      sms_count_mean: 65.56
      roaming_days_mean: 0.99
      countries_visited_mean: 0.61
      active_days_mean: 26.86
      plan_tier_mean: 2.02
    Roaming / travel-heavy:
      data_gb_mean: 40.84
      voice_min_mean: 381.11
      sms_count_mean: 44.67
      roaming_days_mean: 13.16
      countries_visited_mean: 3.88
      active_days_mean: 27.00
      plan_tier_mean: 3.54
    Broad usage profile:
      data_gb_mean: 59.23
      voice_min_mean: 618.48
      sms_count_mean: 116.71
      roaming_days_mean: 2.99
      countries_visited_mean: 1.54
      active_days_mean: 27.98
      plan_tier_mean: 3.49
runtime:
  # Slider → descriptive feature imputation. These values only enrich the profile
  # narrative; they are not clustering inputs.
  feature_defaults:
    countries_multiplier: 0.3
    countries_min: 1.0
    countries_max: 12.0
    night_ratio_low: 0.25
    night_ratio_high: 0.35
    night_ratio_data_threshold: 50.0
    weekend_ratio: 0.35
    session_mb_multiplier: 3.0
    session_mb_max: 500.0
    active_days_base: 10.0
    active_days_data_divisor: 5.0
    active_days_max: 28.0
    plan_tier_mid_threshold: 25.0
    plan_tier_high_threshold: 60.0
  # Trend units: data/voice in % change per year (same as the UI sliders);
  # roaming in Δ roaming days/month per year; lines in Δ active lines per year.
  overlay_thresholds:
    mixed_profile_ratio: 1.3
    data_trend_growing_min: 10.0
    data_trend_shrinking_max: -10.0
    voice_trend_declining_max: -10.0
    roaming_trend_growing_min: 2.0
    lines_trend_growing_min: 0.5
training:
  min_silhouette: 0.5
  random_state: 42
  offline_only: true
llm:
  default_model: ollama/qwen2.5:7b
  models:
    - ollama/llama3.2:3b
    - ollama/qwen2.5:7b
    - ollama/llama3.1:8b
    - ollama/mistral-nemo:12b
    - openai/gpt-4.1-mini
    - anthropic/claude-opus-5-5
    - gemini/gemini-2.5-flash
ui:
  title: Private Customer Profiler
  usage_sliders:
    data_gb: ["Monthly data (GB)", 0, 150, 30]
    voice_min: ["Voice minutes", 0, 3000, 400]
    sms_count: ["SMS count", 0, 500, 50]
    roaming_days: ["Roaming days / month", 0, 30, 2]
  trend_sliders:
    data_trend: ["Data trend (% / year)", -50, 50, 5]
    voice_trend: ["Voice trend (% / year)", -50, 50, 0]
  profiles:
    Streamer:
      data_gb: 100
      voice_min: 150
      sms_count: 20
      roaming_days: 3
      data_trend: 12
      voice_trend: -5
    Chatterbox:
      data_gb: 12
      voice_min: 2000
      sms_count: 80
      roaming_days: 2
      data_trend: -5
      voice_trend: 8
    Essential:
      data_gb: 8
      voice_min: 200
      sms_count: 30
      roaming_days: 1
      data_trend: 0
      voice_trend: 0
    Roamer:
      data_gb: 35
      voice_min: 400
      sms_count: 25
      roaming_days: 15
      data_trend: 5
      voice_trend: 0
    Messenger:
      data_gb: 25
      voice_min: 100
      sms_count: 200
      roaming_days: 1
      data_trend: 3
      voice_trend: -8
