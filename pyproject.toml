[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "telekom-personal-plan-recommender"
version = "0.2.0"
description = "Telekom Private Customer Profiler — B2C usage-driven plan recommendations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "gradio>=6.14.0,<7",
  "ollama>=0.4.0,<1",
  "python-dotenv>=1.0.0,<2",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "commitizen>=4.0.0,<5",
]
ml = [
  "pandas>=2.0.0,<3",
  "numpy>=1.24.0,<3",
  "scikit-learn>=1.3.0,<2",
  "scipy>=1.11.0,<2",
  "joblib>=1.3.0,<2",
  "openpyxl>=3.1.0,<4",
]

[project.scripts]
telekom-profiler = "telekom_profiler:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["telekom_profiler*"]

[tool.setuptools.package-data]
telekom_profiler = [
  "prompts/templates/*.md",
  "data/*.md",
  "ui/theme/*.css",
  "assets/*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"telekom_profiler/domain/profiling.py" = ["E501"]
"telekom_profiler/domain/offers.py" = ["E501"]
"telekom_profiler/ml/train.py" = ["E501"]
"telekom_profiler/ml/inference.py" = ["E501"]
"telekom_profiler/ui/demo.py" = ["E501"]
"scripts/*.py" = ["E402", "E501"]

[tool.mypy]
python_version = "3.10"
packages = ["telekom_profiler"]
ignore_missing_imports = true
warn_return_any = false

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
major_version_zero = true
version_files = [
  "pyproject.toml:project.version",
]
